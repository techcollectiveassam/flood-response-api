services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://techcollectiveassam:techcollectiveassam@db:5432/flood_response?sslmode=disable
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flood_response
      POSTGRES_USER: techcollectiveassam
      POSTGRES_PASSWORD: techcollectiveassam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
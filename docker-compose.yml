services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-10}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
      DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-30m}
      DATABASE_CONN_MAX_IDLE_TIME: ${DATABASE_CONN_MAX_IDLE_TIME:-5m}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5s}
    volumes:
      - .:/app
      - go_module_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

   # Debug mode with Delve.
  app-debug:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    ports:
      - "${APP_PORT:-8080}:8080"
      - "${DEBUG_PORT:-40000}:40000"

    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-10}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
      DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-30m}
      DATABASE_CONN_MAX_IDLE_TIME: ${DATABASE_CONN_MAX_IDLE_TIME:-5m}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5s}
    volumes:
      - .:/app
      - go_module_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build

    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "dlv",
        "debug",
        "./cmd/server",
        "--headless=true",
        "--listen=:40000",
        "--api-version=2",
        "--accept-multiclient"
      ]
    profiles: ["debug"]

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flood_response}
      POSTGRES_USER: ${POSTGRES_USER:-techcollectiveassam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techcollectiveassam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techcollectiveassam} -d ${POSTGRES_DB:-flood_response}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.goose
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./${MIGRATIONS_DIR:-internal/pkg/database/migrations}:/migrations
    environment:
      GOOSE_DRIVER: ${DATABASE_DRIVER:-postgres}
      GOOSE_DBSTRING: ${DATABASE_URL}
      GOOSE_MIGRATION_DIR: /migrations
    profiles: ["tools"]

  bruno:
    image: usebruno/cli:4.1.0
    # Collection is mounted read-only intentionally: Bruno persists env var
    # updates (captures) back to environments/ci.bru, which would pollute the
    # committed file. Captures still work in-memory during the run; the host
    # only receives the junit report written to /results. The EROFS warning
    # printed by bru is expected and harmless.
    volumes:
      - ./tools/bruno/collections/flood-response-api:/bruno:ro
      - ./test-results:/results
    working_dir: /bruno
    depends_on:
      app:
        condition: service_healthy
    command: ["run", "-r", "--env", "ci", "--reporter-junit", "/results/bruno-junit.xml"]
    profiles: ["test"]

volumes:
  postgres_data:
  go_module_cache:
  go_build_cache:
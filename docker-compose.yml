services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://techcollectiveassam:techcollectiveassam@db:5432/flood_response?sslmode=disable
    volumes:
      - .:/app
      - go_module_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flood_response
      POSTGRES_USER: techcollectiveassam
      POSTGRES_PASSWORD: techcollectiveassam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techcollectiveassam -d flood_response"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  go_module_cache:
  go_build_cache:

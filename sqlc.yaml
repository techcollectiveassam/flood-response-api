version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/pkg/database/queries"
    schema: "internal/pkg/database/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/pkg/database/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - column: "affected_areas.geom"
            go_type:
              type: "[]byte"